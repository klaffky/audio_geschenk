<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eine Nachricht für dich ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(145deg, #151515, #3a2028);
      color: white;
      padding: 25px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 45px 25px;
      border-radius: 28px;
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .heart {
      font-size: 60px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 30px;
      margin: 0 0 12px;
    }

    p {
      font-size: 17px;
      opacity: 0.85;
      margin-bottom: 35px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 20px;
      font-size: 21px;
      font-weight: 600;
      color: white;
      background: #d94b68;
      box-shadow: 0 10px 25px rgba(217,75,104,0.35);
    }

    button:active {
      transform: scale(0.97);
    }

    audio {
      width: 100%;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="heart">❤️</div>

    <h1>Eine Nachricht für dich</h1>

    <p>Tippe auf den Button und hör dir deine persönliche Nachricht an.</p>

    <button onclick="playAudio()">
      ▶️ Nachricht abspielen
    </button>

    <audio id="audio" controls>
      <source src="AUDIO-2026-09-29-21-21-08.m4a" type="audio/mp4">
      Dein Browser unterstützt die Audio-Wiedergabe nicht.
    </audio>

  </div>

  <script>
    function playAudio() {
      const audio = document.getElementById("audio");
      audio.play();
    }
  </script>

</body>
</html>
